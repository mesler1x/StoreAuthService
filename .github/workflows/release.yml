name: Deploy to Yandex Container Registry

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  REGISTRY: cr.yandex
  IMAGE_NAME: auth-service
  REGISTRY_ID: ${{ secrets.YC_REGISTRY_ID }}
  VM_USER: ${{ secrets.SWARM_MANAGER_USER }}
  VM_HOST: ${{ secrets.SWARM_MANAGER_HOST }}
  DEPLOY_DIR: /home/${{ secrets.SWARM_MANAGER_USER }}/store-auth
  DOCKERFILE_PATH: ./Dockerfile

jobs:
  build-and-push:
    name: Build and push Docker image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Container Registry with Docker
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: json_key
          password: ${{ secrets.YC_SA_JSON }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.REGISTRY_ID }}/auth-service
          tags: |
            type=raw,value=latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ env.DOCKERFILE_PATH }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy-to-swarm:
    name: Deploy to Docker Swarm
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH connection once
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SWARM_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H ${{ env.VM_HOST }} >> ~/.ssh/known_hosts

      - name: Prepare deployment directory and copy files
        run: |
          scp -i ~/.ssh/id_ed25519 \
            docker-compose.release.local.yml \
            docker-compose.release.swarm.yml \
            ${{ env.VM_USER }}@${{ env.VM_HOST }}:${{ env.DEPLOY_DIR }}/

      - name: Execute complete deployment
        run: |
          ssh -i ~/.ssh/id_ed25519 ${{ env.VM_USER }}@${{ env.VM_HOST }} << 'EOF'
          set -e
                    
          cd ${{ env.DEPLOY_DIR }}
          
          echo "Initializing Docker Swarm if needed..."
          if ! docker node ls &> /dev/null; then
            echo "Initializing Swarm..."
            INTERNAL_IP=$(hostname -I | awk '{print $1}')
            docker swarm init --advertise-addr ${{ env.VM_HOST }} || docker swarm init
          fi
          
          echo "Creating overlay network if needed..."
          if ! docker network ls | grep -q store-net; then
            docker network create --driver overlay --attachable store-net
          fi
          
          echo "Logging into Yandex Container Registry..."
          echo '${{ secrets.YC_SA_JSON }}' | docker login \
            --username json_key \
            --password-stdin \
            cr.yandex
          
          echo "Pulling latest image..."
          docker pull cr.yandex/${{ secrets.YC_REGISTRY_ID }}/${{ env.IMAGE_NAME }}:latest
          
          echo "Starting local dependencies (PostgreSQL + Redis)..."
          if ! docker ps --format '{{.Names}}' | grep -q 'store_postgres'; then
            docker-compose -f docker-compose.release.local.yml up -d
            sleep 3
            echo "Connecting local containers to overlay network..."
            docker network connect store-net store_postgres
            docker network connect store-net store_redis
          fi
          
          echo "Preparing environment variables..."
          rm .env_${{ env.IMAGE_NAME }}
          cat > .env_${{ env.IMAGE_NAME }} << ENV_EOF
          REGISTRY_ID=${{ secrets.YC_REGISTRY_ID }}
          NODE_NAME=$(hostname)
          SERVICE_PORT=8080
          SMTP_YA_PWD=${{ secrets.SMTP_PASSWORD }}
          ENV_EOF
          
          echo "Deploying to Docker Swarm..."
          docker stack deploy -c docker-compose.release.swarm.yml auth-service
          
          echo "Service status:"
          sleep 10
          docker service ls