services:
  auth-service:
    image: cr.yandex/${REGISTRY_ID}/auth-service:latest
    env_file:
      - .env_auth-service
    environment:
      - WEBSTORE_REDIS_HOST=store_redis
      - WEBSTORE_REDIS_PORT=6379
      - WEBSTORE_PG_URL=jdbc:postgresql://store_postgres:5432/webstore
      - WEBSTORE_PG_USER=postgres
      - WEBSTORE_PG_PASS=postgres
      - SMTP_PASSWORD=${SMTP_YA_PWD}
      - SPRING_PROFILES_ACTIVE=prod,swarm
      - SPRING_APPLICATION_NAME=StoreAuthService
    networks:
      - store-net
    deploy:
      replicas: 1
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 3
      update_config:
        parallelism: 1
        delay: 30s
        order: start-first
    ports:
      - target: 8080
        published: 8080
        protocol: tcp
        mode: host

networks:
  store-net:
    external: true
    name: store-net