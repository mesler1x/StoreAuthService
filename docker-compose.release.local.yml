services:
  redis:
    image: redis:latest
    container_name: store_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - store-net
    restart: unless-stopped

  postgres:
    image: postgres:15
    container_name: store_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: webstore
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - store-net
    restart: unless-stopped

networks:
  store-net:
    driver: bridge

volumes:
  redis_data:
  postgres_data: